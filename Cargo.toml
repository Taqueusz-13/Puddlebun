[package]
name = "puddlebun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
dirs = "7.0.0"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
env_logger = "0.11.12"
fastrand = "2.5.0"
glam = { version = "0.34.3", features = ["bytemuck"] }
log = "0.4.35"
png = "0.18.1"
pollster = "1.0.3"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
